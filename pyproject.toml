[project]
name = "obfs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Алекса Ћетковић", email = "cetkovic.sv77.2022@uns.ac.rs" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
datasets = [
    "pooch>=1.9.0",
]

[dependency-groups]
dev = [
    "obfs[datasets]",
    "networkx>=3.7",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.101",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
